<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="처음 만나는 티츄 — 네 명이 함께 시작하는 테이블 가이드"
    />
    <title>티츄 — 게임 시작</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-label="티츄 게임 시작 안내">
        <div class="hero__stage">
          <div class="hero__visual" aria-hidden="false">
            <div class="hero__dragon" role="img" aria-label="용"></div>
            <img class="hero__logo" src="tichu.png" alt="티츄 로고" />
          </div>

          <div class="hero__copy" aria-live="off">
            <p class="hero__line hero__line--question">네 명이 모였나요?</p>
            <p class="hero__line hero__line--versus">2 <span>vs</span> 2</p>
            <p class="hero__line hero__line--guide">파트너와 마주보고 앉으세요</p>
          </div>

          <div class="goal" aria-labelledby="goal-title">
            <p class="goal__time">30 – 60분</p>
            <h2 class="goal__eyebrow" id="goal-title">승리 조건</h2>
            <p class="goal__core">손에 쥔 카드,<br /><strong>전부 비우기!</strong></p>

            <div class="goal__ways">
              <p class="goal__way">가장 먼저 — 소진!</p>
              <p class="goal__way">
                파트너와 함께 —
                <span class="goal__highlight">1000점 도달<span class="goal__stroke" aria-hidden="true"></span></span>!!
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
